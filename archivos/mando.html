.tabs{position:sticky;top:0;z-index:2;display:flex;gap:2px;padding:6px 8px 0;background:var(--p);border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:7px 2px;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;font-weight:700;font-size:.72rem;color:var(--mu)}.tabs button[aria-selected=true]{color:var(--tx);border-bottom-color:var(--bl)}

.panel p{margin:5px 0}.btn{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--p2);cursor:pointer;font-weight:700;font-size:.78rem}.btn.pri{background:#1d4d63;border-color:var(--bl);color:#fff}.btn[disabled]{opacity:.4;cursor:default}

.q{margin:8px 0}.q button.o{display:block;width:100%;margin:5px 0;padding:9px 10px;text-align:left;border:2px solid var(--line);border-radius:10px;background:var(--p2);cursor:pointer;font-weight:600}.q button.o.ok{border-color:var(--gr);background:var(--okbg)}.q button.o.no{border-color:var(--rd);background:var(--badbg)}

.hl{filter:drop-shadow(0 0 7px #ffd65a) drop-shadow(0 0 3px #ffd65a);animation:hlp .9s ease-in-out infinite alternate}@keyframes hlp{from{opacity:.75}to{opacity:1}}
.pulse{animation:pu 1s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}
[data-id]{cursor:pointer}[data-act]{cursor:pointer}
.lab{fill:var(--ink);font:700 14px system-ui,sans-serif}.lab.c{text-anchor:middle}.lab.r{text-anchor:end}.lab.s{font-size:11.5px;font-weight:600;opacity:.9}.lab.t{font-size:16px}
.pizarra .ttl h1{font-size:1.4rem}.pizarra .ttl small{font-size:.9rem}.pizarra header.top{min-height:62px}.pizarra .tools button{width:48px;height:48px;font-size:1.25rem}.pizarra .panel{flex-basis:450px;font-size:1.05rem}.pizarra .chip{font-size:1rem;padding:8px 14px}.pizarra .hint{font-size:1.05rem}.pizarra .lab{font-size:17px}.pizarra .lab.s{font-size:14px}.pizarra #info{font-size:1.05rem}
@media (max-width:950px){.panel{position:absolute;z-index:6;right:0;top:0;bottom:0;width:min(400px,76%);box-shadow:-8px 0 24px #000a;flex:none}.panel.closed{display:block;transform:translateX(105%);visibility:hidden}.work{position:relative}}
@media (max-height:520px){header.top{min-height:34px;padding-top:2px;padding-bottom:2px}.ttl h1{font-size:.8rem}.ttl small{display:none}.tools button{width:30px;height:30px}.top .autor-badge{padding:3px 8px;font-size:.62rem}.chip{padding:4px 8px;font-size:.7rem}}

</style></head><body>
<header class="top">
 <div class="ttl"><h1 id="title">Circuito de mando</h1><small id="sub"></small></div>
 <div class="tools">
  <button id="bPanel" title="Mostrar u ocultar el panel" aria-label="Panel" aria-pressed="true">☰</button>
  <button id="bSound" title="Sonidos" aria-label="Sonidos" aria-pressed="true">🔊</button>
  <button id="bTheme" class="solo" title="Fondo claro u oscuro" aria-label="Cambiar tema">◐</button>
  <button id="bProj" class="solo" title="Modo pizarra" aria-label="Modo pizarra" aria-pressed="false"><b>Aa</b></button>
  <button id="bFull" class="solo" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
 </div>
</header>
<div class="work">
 <section class="stage">
  <svg id="st" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Esquema eléctrico"></svg>
  <div id="info" hidden></div>
  <div class="bar" id="bar"></div>
 </section>
 <aside id="panel" class="panel"></aside>
</div>
<script>window.CIRCUITOS={};</script>
<script src="mando-circuitos.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s),svg=$('#st'),CS=window.CIRCUITOS;
const params=new URLSearchParams(location.search),cid=CS[params.get('c')]?params.get('c'):Object.keys(CS)[0],CK=CS[cid];
const fm=(n,k)=>Number(n).toFixed(k).replace('.',',');
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const COL={F:'#c8703d',N:'#58b8e8',R:'#b5733e',S:'#9aa5b1',T:'#ee5a4d'};
/* ------------------------------------------------------------------ estado */
const IT={};CK.items.forEach(i=>{IT[i.id||('_'+Math.random())]=i});
let tab='guia',sel=null,t=0,guided=CK.pasos.length?0:null,stepDone=[],predAns={},qi=0,score=0,answered=null;
let S;
function nuevo(){S={btn:{},sel:{},arm:{},coil:{},lamp:{},kt:{tm:0,out:false},q:{on:true,trip:'',h:0},th:{trip:false,h:0},fus:{blown:false},
 w:0,I:0,Iph:[0,0,0],mode:'parado',dir:1,short:false,carga:'n',vel:2,T:CK.T||6,fault:{},ev:[],msg:''};
 (CK.coils||[]).forEach(n=>{S.arm[n]=0;S.coil[n]=false});
 (CK.init||(()=>{}))(S)}
nuevo();
/* ------------------------------------------------------------------ sonido */
let soundOn=true,actx=null,nbuf=null;
function audio(){if(!soundOn)return null;if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;actx=new A()}if(actx.state==='suspended')actx.resume();return actx}
function tone(fq,d,ty,v,dl,f2){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+(dl||0);o.type=ty||'sine';o.frequency.setValueAtTime(fq,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.05,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(a.destination);o.start(s);o.stop(s+d+.03)}
function noise(d,v,dl,fq,q){const a=audio();if(!a)return;if(!nbuf){nbuf=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=nbuf.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1}const s=a.currentTime+(dl||0),src=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();src.buffer=nbuf;fl.type='bandpass';fl.frequency.value=fq||1500;fl.Q.value=q||1;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);src.connect(fl).connect(g).connect(a.destination);src.start(s);src.stop(s+d+.02)}
const SND={click(){tone(560,.05,'triangle',.04);noise(.03,.03,0,2500,3)},clack(){noise(.09,.2,0,900,1.2);tone(150,.12,'square',.06,0,70);tone(2300,.04,'square',.02)},tac(){noise(.06,.1,0,1800,1.5);tone(260,.06,'square',.035,0,120)},zap(){noise(.35,.12,0,4000,.7);tone(120,.3,'sawtooth',.06,0,60)},ok(){tone(660,.12,'sine',.05);tone(880,.2,'sine',.045,.09)},no(){tone(260,.18,'triangle',.06);tone(210,.22,'triangle',.05,.1)},warn(){tone(300,.2,'triangle',.05)}};
const play=n=>{try{SND[n]&&SND[n]()}catch{}};
/* ------------------------------------------------------------------ geometría */
const H0={cont:64,coil:50,lamp:48,fuse:52,heater:48};
function dims(i){return i.h||H0[i.t]||64}
function terms(i){const x=i.x,y=i.y,h=dims(i);
 if(i.t==='src')return[[i.n,x,y]];
 if(i.t==='m3')return[[i.n[0],x-30,y],[i.n[1],x,y],[i.n[2],x+30,y]];
 if(i.t==='m6')return[[i.n[0],x-40,y],[i.n[1],x,y],[i.n[2],x+40,y],[i.n[3],x-40,y+110],[i.n[4],x,y+110],[i.n[5],x+40,y+110]];
 if(i.t==='bus')return[];
 return[[i.n1,x,y],[i.n2,x,y+h]]}
/* ------------------------------------------------------------------ solver */
function closedItem(i){
 if(i.t==='fuse')return!S.fus.blown;
 if(i.t==='heater')return true;
 if(i.t!=='cont')return false;
 if(i.inter&&S.fault.sinEnclav)return true;
 if(i.fase&&S.fault.fase)return false;
 const [k,n]=(i.ctl||'').split(':');let act=false;
 if(k==='coil')act=S.arm[n]>.5||(S.fault.peg&&i.peg&&S.pegado);
 else if(k==='btn')act=!!S.btn[n];
 else if(k==='sel')act=!!S.sel[n];
 else if(k==='kt')act=S.kt.out;
 else if(k==='q')act=S.q.on&&!S.q.trip;
 else if(k==='qt')act=!!S.q.trip;
 else if(k==='th')act=S.th.trip;
 return i.form==='NC'?!act:act}
function UF(){const p={};const f=a=>{if(p[a]===undefined)p[a]=a;while(p[a]!==a){p[a]=p[p[a]];a=p[a]}return a};return{f,u:(a,b)=>{p[f(a)]=f(b)}}}
function solve(){const uf=UF();CK.items.forEach(i=>{terms(i).forEach(x=>uf.f(x[0]))});
 const edges=[];CK.items.forEach(i=>{if(closedItem(i)){uf.u(i.n1,i.n2);edges.push(i)}});
 S.uf=uf;S.edges=edges;
 const rF=uf.f('F'),rN=uf.f('N');S.shortCtl=rF===rN;
 CK.items.forEach(i=>{if(i.t==='coil'||i.t==='lamp'){const a=uf.f(i.n1),b=uf.f(i.n2);const en=!S.shortCtl&&((a===rF&&b===rN)||(a===rN&&b===rF));if(i.t==='coil')S.coil[i.id]=en;else S.lamp[i.id]=en}});
 /* potencia */
 const ph={R:uf.f('R'),S:uf.f('S'),T:uf.f('T')};S.phr=ph;
 S.short=(ph.R===ph.S||ph.S===ph.T||ph.R===ph.T)||S.carga==='cc'&&false;
 const phase=n=>{const r=uf.f(n);return r===ph.R?'R':r===ph.S?'S':r===ph.T?'T':null};
 const M=CK.items.find(i=>i.t==='m3'||i.t==='m6');let mode='parado',dir=1,pw=[0,0,0];
 if(M&&!S.short){const idx={R:0,S:1,T:2};
  if(M.t==='m3'){const p=M.n.map(phase);const set=new Set(p.filter(Boolean));if(set.size===3){mode='directo';dir=perm(p.map(a=>idx[a]))}else if(set.size===2){mode='mono';p.forEach(a=>{if(a)pw[idx[a]]=1})}}
  else{const n=M.n,p=n.map(phase),roots=n.map(a=>uf.f(a));const cnt={};roots.forEach(r=>cnt[r]=(cnt[r]||0)+1);
   const starRoot=n.find((a,i)=>!p[i]&&cnt[roots[i]]>=3);const sr=starRoot?uf.f(starRoot):null;
   const U1=p[0],V1=p[1],W1=p[2];
   const star=U1&&V1&&W1&&new Set([U1,V1,W1]).size===3&&sr&&roots[3]===sr&&roots[4]===sr&&roots[5]===sr;
   const delta=p.every(Boolean)&&new Set([U1,V1,W1]).size===3&&p[0]!==p[4]&&p[1]!==p[5]&&p[2]!==p[3]&&p[0]===p[3]&&p[1]===p[4]&&p[2]===p[5];
   if(star){mode='estrella';dir=perm([U1,V1,W1].map(a=>idx[a]))}
   else if(delta){mode='triangulo';dir=perm([U1,V1,W1].map(a=>idx[a]))}
   else if(p.slice(0,3).some(Boolean)&&(p.slice(0,3).filter(Boolean).length<3)){mode='mono';p.forEach(a=>{if(a)pw[idx[a]]=1})}}
  if(S.carga==='cc'&&mode!=='parado')S.short=true}
 S.mode=mode;S.dir=dir;S.pw=pw}
function perm(a){const inv=(a[0]>a[1])+(a[0]>a[2])+(a[1]>a[2]);return inv%2===0?1:-1}
/* camino de la corriente (para la narración y el flujo) */
function adj(){const A={};S.edges.forEach(e=>{const a=S.uf.f(e.n1);(A[e.n1]=A[e.n1]||[]).push([e.n2,e]);(A[e.n2]=A[e.n2]||[]).push([e.n1,e])});return A}
function bfs(A,from,goal){const q=[from],par={[from]:null};while(q.length){const u=q.shift();if(u===goal)break;(A[u]||[]).forEach(([v,e])=>{if(!(v in par)){par[v]=[u,e];q.push(v)}})}if(!(goal in par))return null;const path=[],nodes=[goal];let c=goal;while(par[c]){path.unshift(par[c][1]);c=par[c][0];nodes.push(c)}return{path,nodes}}
function flows(){const A=adj(),fi=new Set(),fn=new Set(),paths=[];
 CK.items.forEach(i=>{if((i.t==='coil'&&S.coil[i.id])||(i.t==='lamp'&&S.lamp[i.id])){let a=i.n1,b=i.n2;if(S.uf.f(a)!==S.uf.f('F')){[a,b]=[b,a]}
  const p1=bfs(A,'F',a),p2=bfs(A,b,'N');if(p1&&p2){p1.path.concat(p2.path).forEach(e=>fi.add(e.id));p1.nodes.concat(p2.nodes).forEach(n=>fn.add(n));paths.push({load:i,p1:p1.path,p2:p2.path})}}});
 if(S.I>0.05&&!S.short){['R','S','T'].forEach(ph=>{CK.items.filter(i=>i.t==='m3'||i.t==='m6').forEach(M=>{M.n.slice(0,3).forEach(n=>{const r=bfs(A,ph,n);if(r){r.nodes.forEach(x=>fn.add(x));r.path.forEach(e=>fi.add(e.id))}})})});
  if(S.mode==='estrella')CK.items.filter(i=>i.t==='m6').forEach(M=>M.n.slice(3).forEach(n=>fn.add(n)))}
 S.flowItems=fi;S.flowNodes=fn;S.paths=paths}
/* ------------------------------------------------------------------ dinámica */
function paso(dt){const ev=[];dt=Math.min(dt,.05)*S.vel;
 /* guardamotor / térmico / fusible */
 const In=CK.In||3.6,Ir=CK.Ir||3.6;
 /* armaduras */
 (CK.coils||[]).forEach(n=>{const tgt=S.coil[n]?1:0,old=S.arm[n];S.arm[n]+=(tgt-old)*Math.min(1,dt*(tgt?14:5));if(old<=.5&&S.arm[n]>.5)ev.push('clack');if(old>.5&&S.arm[n]<=.5)ev.push('tac');if(S.fault.peg&&n==='KM1'&&S.arm[n]>.5)S.pegado=true;if(!S.fault.peg)S.pegado=false});
 if(S.fault.peg&&S.pegado)S.arm.KM1=Math.max(S.arm.KM1,.6);
 /* temporizador */
 const kt=CK.items.find(i=>i.t==='coil'&&i.id==='KT1');if(kt){if(S.coil.KT1){S.kt.tm+=dt;if(!S.kt.out&&S.kt.tm>=S.T){S.kt.out=true;ev.push('tac')}}else{S.kt.tm=0;if(S.kt.out){S.kt.out=false;ev.push('tac')}}}

 const mode=S.mode;let tw=0,tau=1.6;

function pEj(){const Q=CK.ejercicios;if(qi>=Q.length)return`<h2>Resultado</h2><div class="vd ${score>=Q.length-1?'ok':score>=Q.length/2?'warn':'bad'}">Respondiste bien ${score} de ${Q.length}.</div><p>${score===Q.length?'¡Perfecto! Entendés cómo funciona este circuito.':'Repasá la guía y probá el circuito de nuevo.'}</p><div class="row"><button class="btn pri" data-q="reset">Reintentar</button></div>`;
 const q=Q[qi];let h=`<h2>Ejercicio ${qi+1} de ${Q.length}</h2><div class="q"><p><b>${q.q}</b></p>${q.o.map((x,i)=>`<button class="o ${answered===null?'':i===q.ok?'ok':i===answered?'no':''}" data-ans="${i}" ${answered!==null?'disabled':''}>${'ABC'[i]}) ${x}</button>`).join('')}</div>`;
 if(answered!==null)h+=`<div class="vd ${answered===q.ok?'ok':'bad'}">${answered===q.ok?'¡Correcto! ':'No es esa. '}${q.why}</div><div class="row"><button class="btn pri" data-q="next">${qi===Q.length-1?'Ver resultado':'Siguiente ▶'}</button></div>`;return h}
function bindPanel(){const p=$('#panel');
 p.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;play('click');panel()});
 p.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>guide(b.dataset.g));
 p.querySelectorAll('[data-pred]').forEach(b=>b.onclick=()=>{predAns[guided]=+b.dataset.pred;play(+b.dataset.pred===CK.pasos[guided].pred.ok?'ok':'no');panel();bar()});
 p.querySelectorAll('[data-carga]').forEach(b=>b.onclick=()=>{S.carga=b.dataset.carga;play('click');panel()});
 p.querySelectorAll('[data-vel]').forEach(b=>b.onclick=()=>{S.vel=+b.dataset.vel;play('click');panel()});
 const rT=$('#rT');if(rT)rT.oninput=()=>{S.T=+rT.value;rT.previousElementSibling.textContent=fm(S.T,0)+' s'};
 p.querySelectorAll('[data-falla]').forEach(b=>b.onclick=()=>{const k=b.dataset.falla;S.fault[k]=!S.fault[k];play(S.fault[k]?'warn':'click');panel()});
 p.querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>{const k=b.dataset.rep;play('tac');if(k==='q'){S.q.trip='';S.q.on=false;S.q.h=0}else if(k==='th'){if(S.th.h<.6){S.th.trip=false}else{S.msg='Esperá a que se enfríe';play('no')}}else if(k==='fus'){S.fus.blown=false}else{nuevo();guided=null}panel();bar()});
 p.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{sel=sel===b.dataset.sel?null:b.dataset.sel;play('click');panel();info()});
 p.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{answered=+b.dataset.ans;const q=CK.ejercicios[qi];if(answered===q.ok){score++;play('ok')}else play('no');panel()});
 p.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const k=b.dataset.q;if(k==='next'){qi++;answered=null}else if(k==='reset'){qi=0;score=0;answered=null}play('click');panel()})}
function guide(k){play('click');if(k==='prev')k=Math.max(0,guided-1);else if(k==='next'){k=guided+1;if(k>=CK.pasos.length){guided=null;panel();bar();return}}else k=+k;guided=k;const s=CK.pasos[k];if(s.prep){nuevo();s.prep(S)}panel();bar()}
function bar(){const b=$('#bar');let h='';if(guided!==null){const s=CK.pasos[guided];const done=stepDone[guided];const show=!s.pred||predAns[guided]!==undefined;h+=`<div class="hint ${done?'done':''}" ${show?'':'hidden'}>${done?'✅ ¡Muy bien! Pasá al siguiente paso.':'👉 '+(s.hint||s.t)}</div>`}
 else h+=`<div class="hint">Probá el circuito: accioná los pulsadores del esquema.</div>`;
 h+=`<button class="chip" data-r="reset">↺ Reiniciar</button>`;b.innerHTML=h;b.querySelector('[data-r]').onclick=()=>{nuevo();guided=null;stepDone=[];play('click');panel();bar()}}
function info(){const b=$('#info');if(!sel||!CK.parts[sel]){b.hidden=true;return}const p=CK.parts[sel];b.hidden=false;b.innerHTML=`<button aria-label="Cerrar">✕</button><b>${p.t}</b><br>${p.d}`;b.querySelector('button').onclick=()=>{sel=null;info()}}
/* ------------------------------------------------------------------ entrada */
let pressed=null;
svg.addEventListener('pointerdown',e=>{audio();const a=e.target.closest('[data-act]');if(a){const k=a.dataset.act,n=a.dataset.n;
  if(k==='btn'){S.btn[n]=true;pressed=n;play('click');try{svg.setPointerCapture(e.pointerId)}catch{}}
  else if(k==='sel'){S.sel[n]=!S.sel[n];play('clack')}
  else if(k==='qh'){if(S.q.trip){S.q.trip='';S.q.on=false;play('tac')}else{S.q.on=!S.q.on;play('clack')}}}
 const d=e.target.closest('[data-id]');if(d&&d.dataset.id&&CK.parts[d.dataset.id]){sel=d.dataset.id;info()}else if(!a){sel=null;info()}});
const rel=()=>{if(pressed){S.btn[pressed]=false;pressed=null;play('tac')}};
addEventListener('pointerup',rel);addEventListener('pointercancel',rel);
/* ------------------------------------------------------------------ bucle */
let last=performance.now(),lastRd='',lastN='',lastSteps=0;
function checkSteps(){if(guided===null)return;const s=CK.pasos[guided];if(!stepDone[guided]&&(s.wait?(!s.pred||predAns[guided]!==undefined)&&s.wait(S):(s.pred&&predAns[guided]!==undefined))){stepDone[guided]=true;play('ok');panel();bar()}}
function loop(ts){const dt=(ts-last)/1000;last=ts;t+=dt;S._t=t;
 if(!document.hidden&&dt>0){solve();flows();paso(dt);S.ev.forEach(play);
  /* tras la dinámica, resolver otra vez para que el dibujo sea coherente */
  solve();flows();render();checkSteps();
  if(tab==='vivo'){const v=$('#vivo'),r=$('#rd');if(v){const h=narr();if(v.dataset.h!==h){v.innerHTML=h;v.dataset.h=h}}if(r){const h=readsHTML();if(r.dataset.h!==h){r.innerHTML=h;r.dataset.h=h}}}}
 requestAnimationFrame(loop)}
/* ------------------------------------------------------------------ ajustes */
const embedded=window.parent!==window;if(embedded)document.querySelectorAll('.solo').forEach(b=>b.hidden=true);
const stg={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let tema=params.get('tema')||stg.get('sim-tema')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'),pizarra=params.has('pizarra')?params.get('pizarra')==='1':stg.get('sim-pizarra')==='1';
function apply(){document.documentElement.dataset.theme=tema;document.body.classList.toggle('pizarra',pizarra);$('#bProj').setAttribute('aria-pressed',String(pizarra))}
function avisar(){try{if(embedded)parent.postMessage({tipo:'ajustes-desde-practica',tema,pizarra},'*')}catch{}}
window.addEventListener('message',e=>{const d=e.data;if(!d)return;if(d.tipo==='reserva'){const h=document.querySelector('header.top');if(h)h.style.paddingRight=d.px+'px';return}if(d.tipo==='ajustes'){if(d.tema)tema=d.tema;if(d.pizarra!==undefined)pizarra=!!d.pizarra;apply()}});
$('#bTheme').onclick=()=>{tema=tema==='light'?'dark':'light';stg.set('sim-tema',tema);apply();avisar()};
$('#bProj').onclick=()=>{pizarra=!pizarra;stg.set('sim-pizarra',pizarra?'1':'0');apply();avisar()};
const canFull=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);$('#bFull').hidden=!canFull||embedded;
$('#bFull').onclick=()=>{const d=document,el=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else(el.requestFullscreen||el.webkitRequestFullscreen).call(el)};
$('#bSound').onclick=e=>{soundOn=!soundOn;e.currentTarget.setAttribute('aria-pressed',String(soundOn));e.currentTarget.textContent=soundOn?'🔊':'🔇';if(soundOn){audio();play('click')}};
const phone=()=>matchMedia('(max-width:950px)').matches;
function setPanel(o){$('#panel').classList.toggle('closed',!o);$('#bPanel').setAttribute('aria-pressed',String(o))}
$('#bPanel').onclick=()=>setPanel($('#panel').classList.contains('closed'));
document.title=CK.titulo;$('#title').textContent=CK.titulo;$('#sub').textContent='Mando de motores · Circuitos';
apply();setPanel(!phone());if(CK.pasos[0]&&CK.pasos[0].prep)CK.pasos[0].prep(S);panel();bar();info();requestAnimationFrame(loop);
window.__mando={render:()=>{solve();flows();render()},CK,S:()=>S,solve,flows,paso,press:(n,v)=>{S.btn[n]=v},sel:(n,v)=>{S.sel[n]=v},nuevo:()=>{nuevo()},set:(k,v)=>{S[k]=v}};
})();
</script><script src="autor.js"></script></body></html>
