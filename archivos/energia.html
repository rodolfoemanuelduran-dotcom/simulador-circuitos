const PORT=[ /* puertos de entrada [dx,dy] y salida [dx,dy] respecto del centro de cada etapa */
 {o:[58,24]},
 {i:[-60,-38],o:[44,40]},
 {i:[-62,-6],o:[64,14]},
 {i:[-62,14],o:[6,-62]},
 {i:[-32,-60],o:[32,-60]},
 {i:[-86,-30],o:[86,-30]},
 {i:[-60,-46],o:[60,-46]},
 {i:[-78,-48],o:[78,-48]},
 {i:[-36,-36],o:[56,50]},
 {i:[-34,-8],o:[34,-8]},
 {i:[-52,20]}
];
function routePath(i){const a=N[i],b=N[i+1],po=PORT[i].o,pi=PORT[i+1].i;
 const ax=a.x+po[0],ay=a.y+po[1],bx=b.x+pi[0],by=b.y+pi[1],mx=(ax+bx)/2;
 return`M${ax} ${ay} C${mx} ${ay} ${mx} ${by} ${bx} ${by}`}
function label(n,on,i){const ls=n.name.split('|'),y0=n.name.includes('|')?78:78;return`<text class="nm ${on?'':'off'}" text-anchor="middle">${ls.map((l,j)=>`<tspan x="0" y="${y0+j*24}">${l}</tspan>`).join('')}</text>`}
function render(){
 const dark=document.documentElement.dataset.theme!=='light';
 let s=`<defs><linearGradient id="rv" x1="0" x2="1"><stop offset="0" stop-color="var(--water)"/><stop offset="1" stop-color="var(--water2)"/></linearGradient></defs>`;
 s+=`<rect x="-200" y="0" width="2100" height="600" fill="transparent"/>`;
 s+=`<path class="mtn1" d="M0 340L110 210L200 290L310 190L440 320L550 260L720 350L900 290L1080 360L1260 310L1440 360L1700 320V600H0Z"/>`;
 s+=`<path class="mtn2" d="M0 420L140 330L290 410L440 370L610 430L810 390L1010 440L1220 400L1420 440L1700 410V600H0Z"/>`;
 s+=`<path class="gnd" d="M0 528H1700V600H0Z"/>`;
 s+=`<path d="M0 556Q140 536 280 556T560 556T840 556T1120 556T1400 556T1680 556T1960 556V600H0Z" fill="url(#rv)" opacity="${dark?.75:.9}"/>`;
 s+=`<text x="40" y="588" style="font:700 17px system-ui;fill:#fff;opacity:.9">RÍO</text>`;
 TR.forEach((t,i)=>{const d=routePath(i),on=i<k,isNext=i===k&&hintOn;
  s+=`<g data-tr="${i}" class="${isNext?'next':''}"><path class="route ${t.tipo} ${on?'on':''}" d="${d}"/>${on?`<path class="flow ${t.tipo}" d="${d}"/>`:''}<path class="hit" d="${d}"/></g>`});
 N.forEach((n,i)=>{const on=i<=k;
  s+=`<g data-n="${i}" class="node ${on?'on':'off'}" transform="translate(${n.x} ${n.y})"><rect x="-80" y="-80" width="160" height="${n.name.includes('|')?190:166}" fill="transparent"/>${icon(n.id,on)}${label(n,on,i)}</g>`});
 svg.innerHTML=s;
}
function chain(){const cur=Math.min(3,k<=0?0:k===1?1:k===2?2:3);$('#chain').innerHTML=CH.map((c,i)=>`<span class="chip ${i<=cur&&k>=0?'on':''} ${i===cur?'cur':''}">${c}</span>`).join('<span style="color:var(--mu)">›</span>')}
function gauge(){const n=N[Math.min(k,10)];const v=n.kv;let txt='—',pct=0;if(v!==null){txt=v>=1?(v+'').replace('.',',')+' kV':(v===.38?'380 / 220 V':'220 V');const volts=v*1000;pct=Math.max(2,Math.min(100,(Math.log10(volts)-2)/(Math.log10(150000)-2)*100))}
 $('#gv').textContent=k===0?'—':txt;$('#gbar').style.width=(k===0?0:pct)+'%'}
function info(msg,cls){const i=$('#info');i.className='info '+(cls||'');i.innerHTML=msg}
function show(i){const n=N[i];info(`<h2>${n.t}</h2><p>${n.p}</p><p class="dato">💡 ${n.d}</p>`)}
function progress(){$('#stText').textContent=k>=10?'¡Llegó a tu casa!':'Tramo '+k+' de 10';$('#bar').style.width=(k*10)+'%'}
function refresh(){render();chain();gauge();progress()}
function activate(i){ // i = tramo a activar
 k=i+1;play(tramoSnd(i));buzz(15);hintOn=false;refresh();
 const n=N[k];info(`<h2>${n.t}</h2><p><b>Tramo ${k}:</b> ${TR[i].txt}</p><p>${n.p}</p><p class="dato">💡 ${n.d}</p>`);
 if(k===10){finished=true;setTimeout(()=>{play('end');buzz([30,60,30,60,90]);info(`<h2>✔ ¡La energía llegó a tu casa!</h2><p>Recorrido completo: agua del embalse → turbina → generador (13,2 kV) → transformador elevador (132 kV) → línea de alta tensión → estación transformadora (13,2 kV) → media tensión → transformador de distribución (380/220 V) → medidor → tablero → tomacorriente (220 V).</p><p class="dato">Ahora podés ir a “Casas y croquis” para proyectar y cablear la instalación de una casa.</p>`,'ok')},900)}
}
function wrongTap(i,target){play('wrong');buzz([40,40,40]);const g=svg.querySelector(`[data-tr="${Math.min(i,9)}"]`);const need=N[k].name.replace('|',' ');
 info(`<h2>Todavía no</h2><p>Primero tiene que llegar la energía a <b>${need}</b>. Después sigue hacia <b>${N[k+1].name.replace('|',' ')}</b>. Probá con el tramo resaltado en amarillo (tocá 💡 para verlo).</p>`,'warn');
 if(target){target.classList.add('shake');setTimeout(()=>target.classList.remove('shake'),450)}}
svg.addEventListener('pointerdown',e=>{audio();const tr=e.target.closest('[data-tr]'),nd=e.target.closest('[data-n]');
 if(tr){const i=+tr.dataset.tr;if(i===k&&k<10)return activate(i);if(i<k){show(i+1);play('click');return}wrongTap(i,tr);return}
 if(nd){const i=+nd.dataset.n;if(i===k+1&&k<10)return activate(k);if(i<=k){show(i);play('click');return}wrongTap(i-1,nd)}});
$('#bHint').onclick=()=>{audio();if(k>=10)return;hintOn=true;play('click');refresh();info(`<h2>Pista</h2><p>La energía sigue desde <b>${N[k].name.replace('|',' ')}</b> hacia <b>${N[k+1].name.replace('|',' ')}</b>. Tocá el tramo que los une (resaltado en amarillo).</p>`,'warn')};
function reset(first){k=0;hintOn=false;finished=false;if(!first)play('reset');refresh();show(0);const i=$('#info');i.insertAdjacentHTML('beforeend','<p class="dato">▶ Tocá el tramo que sale del embalse para que la energía siga su camino.</p>')}
$('#bReset').onclick=()=>reset(false);
$('#bSound').onclick=e=>{soundOn=!soundOn;e.currentTarget.setAttribute('aria-pressed',String(soundOn));e.currentTarget.textContent=soundOn?'🔊':'🔇';if(soundOn){audio();play('click')}};
/* ---------- tema, pizarra y mensajes con el menú ---------- */
const params=new URLSearchParams(location.search),embedded=window.parent!==window;
if(embedded)document.querySelectorAll('.solo').forEach(b=>b.hidden=true);
const stg={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let tema=params.get('tema')||stg.get('sim-tema')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'),pizarra=params.has('pizarra')?params.get('pizarra')==='1':stg.get('sim-pizarra')==='1';
function apply(){document.documentElement.dataset.theme=tema;document.body.classList.toggle('pizarra',pizarra);$('#bProj').setAttribute('aria-pressed',String(pizarra));render()}
function avisar(){try{if(embedded)parent.postMessage({tipo:'ajustes-desde-practica',tema,pizarra},'*')}catch{}}
window.addEventListener('message',e=>{const d=e.data;if(d&&d.tipo==='reserva'){const h=document.querySelector('header.top');if(h)h.style.paddingRight=d.px+'px';return}if(d&&d.tipo==='ajustes'){if(d.tema)tema=d.tema;if(d.pizarra!==undefined)pizarra=!!d.pizarra;apply()}});
$('#bTheme').onclick=()=>{tema=tema==='light'?'dark':'light';stg.set('sim-tema',tema);apply();avisar()};
$('#bProj').onclick=()=>{pizarra=!pizarra;stg.set('sim-pizarra',pizarra?'1':'0');apply();avisar()};
const canFull=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);$('#bFull').hidden=!canFull||embedded;
$('#bFull').onclick=()=>{const d=document,el=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else(el.requestFullscreen||el.webkitRequestFullscreen).call(el)};
apply();reset(true);
window.__en={act:i=>activate(i),k:()=>k,N,TR,reset:()=>reset(false),tapTr:i=>{const g=svg.querySelector(`[data-tr="${i}"] .hit`);g.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}))},tapNode:i=>{const g=svg.querySelector(`[data-n="${i}"] rect`);g.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}))}};
})();
