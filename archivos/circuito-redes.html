<script>
(()=>{
const D=window.REDES,$=s=>document.querySelector(s),svg=$('#board'),gW=$('#gWires'),gC=$('#gComps'),gT=$('#gTerms'),gP=$('#gPlug'),prev=$('#prev'),prevS=$('#prevS');
const params=new URLSearchParams(location.search);
const sc=D.items[params.get('c')]||D.items[D.order[0]];
const H=500,VH=548;let W=1000,scale=1;
const AC=!!sc.ac;
const DCW=[['red','Rojo','#e5484d'],['blue','Celeste','#4db5ee'],['green','Verde','#3ecf7a'],['yellow','Amarillo','#f2c94c'],['gray','Gris','#c3ccd8']];
const ACW=[['brown','Marrón · Fase','#b5651d'],['blue','Celeste · Neutro','#4db5ee'],['earth','Verde/amarillo · Tierra','#37c870']];
const WIRE_COLORS=AC?ACW:DCW,wcol=k=>{const c=(WIRE_COLORS.find(c=>c[0]===k)||WIRE_COLORS[0])[2];return k==='gray'&&document.documentElement.dataset.theme==='light'?'#7b889b':c};
const cm={};sc.comps.forEach(c=>cm[c.id]=c);
const SRC=sc.comps.find(c=>c.t==='bat'||c.t==='src');
const sws=sc.comps.filter(c=>c.t==='sw'||c.t==='sw3');
const tomas=sc.comps.filter(c=>c.t==='toma'),motor=sc.comps.find(c=>c.t==='motor');
let links=[],swState={},broken={},color=AC?'brown':'red',selComp=null,selWire=null,drag=null,pend=null,showVals=!sc.fault&&!AC,tableOn=false,soundOn=true,faultId=null,attempts=0,fixed=false,done=false,lastSim=null,lastDiag=null,plugTo=null,plugPos=null,prevLit={},prevRun=false;

/* ---------- terminales ---------- */
const BRK=(k,x,y,dx,dy,role,label)=>({k,x,y,dx,dy,role,label});
function tdefs(c){
 switch(c.t){
  case'bat':return[BRK('n',0,62,0,1,'N','−'),BRK('p',0,-62,0,-1,'L','+')];
  case'src':return[BRK('L',62,-54,1,0,'L','L'),BRK('N',62,0,1,0,'N','N'),BRK('PE',62,54,1,0,'PE','PE')];
  case'sw3':{const f=c.flip?-1:1;return[BRK('c',-62*f,0,-f,0,'L','C'),BRK('a',62*f,-28,f,0,'L','1'),BRK('b',62*f,28,f,0,'L','2')]}
  case'led':return[BRK('a',-62,0,-1,0,'L','A'),BRK('k',62,0,1,0,'N','K')];
  case'toma':return[BRK('L',-62,-54,-1,0,'L','L'),BRK('N',-62,0,-1,0,'N','N'),BRK('PE',-62,54,-1,0,'PE','PE')];
  case'rod':return[BRK('p',0,-52,0,-1,'PE','PE')];
  case'box':return c.rows.flatMap((row,ri)=>row.t.map((k,i)=>{const top=ri===0,bot=ri===c.rows.length-1;return BRK(k,(i-(row.t.length-1)/2)*62,(ri-(c.rows.length-1)/2)*58,top||bot||i*2+1===row.t.length?0:(i*2+1<row.t.length?-1:1),top?-1:bot?1:0,row.role,row.label)}));
  case'motor':return[];
  default:return[BRK('a',-62,0,-1,0,c.t==='lamp'||c.t==='sw'?'L':'L','L'),BRK('b',62,0,1,0,c.t==='lamp'?'N':'L','N')];
 }
}
const TM={};sc.comps.forEach(c=>{c.defs=tdefs(c);c.defs.forEach(d=>{d.id=c.id+'.'+d.k;d.c=c;TM[d.id]=d})});
const allT=Object.keys(TM);
function tp(id){const d=TM[id],c=d.c;return{x:c.fx*W+d.x,y:c.fy*H+d.y,dx:d.dx,dy:d.dy}}
const SLOTS=[[.3,.22],[.5,.22],[.7,.22],[.9,.22],[.9,.76],[.7,.76],[.5,.76],[.3,.76]];
(function place(){let k=0;sc.comps.forEach(c=>{const s=(sc.pos&&sc.pos[c.id]);if(s){c.fx=s[0];c.fy=s[1]}else if(c.t==='bat'||c.t==='src'){c.fx=.1;c.fy=.5}else{const q=SLOTS[k++];c.fx=q[0];c.fy=q[1]}});plugHome=motor?(sc.plug||[motor.fx-.06,motor.fy+.22]):[0,0];plugPos={fx:plugHome[0],fy:plugHome[1]}})();
var plugHome;

/* ---------- formato ---------- */
const dc=s=>String(s).replace('.',',');
const fV=v=>dc((Math.abs(v)<.005?0:Math.abs(v)).toFixed(2))+' V';
const fI=i=>{i=Math.abs(i);if(i<1e-6)return'0 mA';if(i>=1)return dc(i.toFixed(2))+' A';const m=i*1000;return dc(m.toFixed(m<10?2:m<100?1:0))+' mA'};
const fR=r=>r>=1000?dc(+(r/1000).toFixed(2))+' kΩ':dc(+r.toFixed(1))+' Ω';
const fP=p=>{p=Math.abs(p);return dc(p<1?(p*1000).toFixed(p<.01?2:0)+' mW':p.toFixed(2)+' W')};
const DIG=['#111','#7b4a1e','#d33','#f80','#fd2','#3a3','#36e','#94c','#888','#eee'],DIGN=['negro','marrón','rojo','naranja','amarillo','verde','azul','violeta','gris','blanco'];
function bands(r){const e=Math.floor(Math.log10(r)),d=Math.round(r/Math.pow(10,e-1));return[Math.floor(d/10),d%10,e-1]}
const buzz=ms=>{try{if(soundOn&&navigator.vibrate)navigator.vibrate(ms)}catch{}};

/* ---------- audio ---------- */
let actx=null,noiseBuf=null,lastSnap=0;
function audio(){if(!soundOn)return null;if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;actx=new A()}if(actx.state==='suspended')actx.resume();return actx}
function tone(f,d,ty='sine',v=.05,dl=0,f2){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+dl;o.type=ty;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(a.destination);o.start(s);o.stop(s+d+.03)}
function noise(d,v=.05,dl=0,f=2000,q=1,type='bandpass'){const a=audio();if(!a)return;if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate,a.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}const s=a.currentTime+dl,src=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();src.buffer=noiseBuf;fl.type=type;fl.frequency.value=f;fl.Q.value=q;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);src.connect(fl).connect(g).connect(a.destination);src.start(s);src.stop(s+d+.02)}
const SND={
 select(){tone(660,.05,'triangle',.035)},
 grab(){tone(380,.09,'sine',.05,0,620);buzz(8)},
 snap(){const n=performance.now();if(n-lastSnap<90)return;lastSnap=n;tone(1100,.035,'triangle',.03)},
 connect(){noise(.05,.05,0,3000,2);tone(520,.09,'sine',.055);tone(784,.13,'sine',.045,.07);buzz(14)},
 pending(){tone(480,.07,'triangle',.045);tone(640,.07,'triangle',.035,.05)},
 wiresel(){noise(.04,.05,0,900,3);tone(300,.05,'triangle',.04)},
 remove(){tone(520,.16,'sine',.04,0,200);noise(.09,.03,.02,1200,1);buzz(10)},
 color(i){tone(440*Math.pow(1.1225,i||0),.06,'square',.02)},
 on(){noise(.035,.06,0,1800,4);tone(210,.05,'square',.03);tone(420,.06,'square',.022,.04);buzz(12)},
 off(){noise(.035,.05,0,1200,4);tone(300,.05,'square',.028);tone(150,.07,'square',.022,.04);buzz(8)},
 sw3(){noise(.03,.05,0,2200,4);tone(260,.04,'square',.03);tone(330,.04,'square',.03,.07);buzz(12)},
 plug(){tone(150,.12,'sine',.09,0,80);noise(.06,.06,0,700,2);tone(520,.08,'sine',.035,.06);buzz([12,30,12])},
 unplug(){tone(300,.1,'sine',.05,0,120);noise(.05,.04,0,1500,2)},
 lampOn(){tone(1320,.35,'sine',.03);tone(1760,.25,'sine',.015,.03)},
 lampOff(){tone(520,.08,'sine',.02,0,300)},
 motorOn(){tone(70,.7,'sawtooth',.03,0,190);noise(.5,.012,0,400,.8,'lowpass')},
 motorOff(){tone(190,.5,'sawtooth',.02,0,60)},
 error(){tone(170,.16,'sawtooth',.05);tone(125,.18,'sawtooth',.04,.1);buzz([40,40,40])},

 }

function updatePreview(pos){if(!drag){prev.setAttribute('d','');prevS.setAttribute('d','');return}

function update(){

 // lámparas y motor

/* ---------- interacción ---------- */
function toSvg(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function nearestTerm(pos,px,cap){let best=null,bd=Math.min(px/scale,cap||46);allT.forEach(id=>{const p=tp(id),d=Math.hypot(p.x-pos.x,p.y-pos.y);if(d<bd){bd=d;best=id}});return best}
function tryConnect(a,b){if(a===b)return false;const dup=links.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a));if(dup){play('error');return false}links.push({a,b,color});play('connect');return true}
let tapStart=null;
svg.addEventListener('pointerdown',e=>{
 audio();const pos=toSvg(e),touch=e.pointerType==='touch'||e.pointerType==='pen';
 const pl=e.target.closest('[data-plug]');
 let t=nearestTerm(pos,touch?36:26);const swHit=e.target.closest('[data-sw]');if(t&&swHit){const q=tp(t);if(Math.hypot(q.x-pos.x,q.y-pos.y)>30)t=null}
 if(t&&!pl){e.preventDefault();try{svg.setPointerCapture(e.pointerId)}catch{}selWire=null;selComp=null;drag={from:t,id:e.pointerId,moved:false,x0:e.clientX,y0:e.clientY};tapStart=t;play('grab');updatePreview(pos);return}
 if(pl){e.preventDefault();try{svg.setPointerCapture(e.pointerId)}catch{}const was=plugTo;plugTo=null;drag={plug:true,id:e.pointerId,was};if(was){play('unplug');update()}plugPos={fx:pos.x/W,fy:pos.y/H};renderPlug();return}
 const w=e.target.closest('[data-w]');if(w){selWire=+w.dataset.w;selComp=null;pend=null;play('wiresel');render();updatePanel();return}
 const c=e.target.closest('[data-c]');
 if(c){const comp=cm[c.dataset.c];selComp=comp.id;selWire=null;pend=null;if((comp.t==='sw'||comp.t==='sw3')&&e.target.closest('[data-sw]')){swState[comp.id]=!swState[comp.id];play(comp.t==='sw3'?'sw3':swState[comp.id]?'on':'off');update();return}play('select');render();updatePanel();return}
 pend=null;selComp=null;selWire=null;render();updatePanel()});
svg.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const pos=toSvg(e);
 if(drag.plug){plugPos={fx:pos.x/W,fy:pos.y/H};renderPlug();return}
 if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>8)drag.moved=true;updatePreview(pos)});
function endDrag(e){if(!drag||drag.id!==e.pointerId)return;const pos=toSvg(e),d=drag;drag=null;updatePreview();
 if(d.plug){let best=null,bd=95;tomas.forEach(c=>{const p=tomaPos(c),dd=Math.hypot(p.x-pos.x,p.y-pos.y);if(dd<bd){bd=dd;best=c.id}});if(best){plugTo=best;play('plug')}else{if(d.was)play('unplug')}update();return}
 const from=d.from;
 if(!d.moved){ // toque simple: modo "tocar y tocar"
  if(pend&&pend!==from){const a=pend;pend=null;tryConnect(a,from)}else if(pend===from){pend=null;play('select')}else{pend=from;play('pending')}update();return}
 pend=null;const best=nearestTerm(pos,52,62);
 if(best&&best!==from)tryConnect(from,best);else play('error');update()}
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',e=>{if(drag&&drag.id===e.pointerId){drag=null;updatePreview();update()}});

 links=[];swState={};broken={};selComp=null;selWire=null;pend=null;attempts=0;fixed=false;done=false;plugTo=null;plugPos={fx:plugHome[0],fy:plugHome[1]};prevLit={};prevRun=false;
