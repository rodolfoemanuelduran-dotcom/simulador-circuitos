<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simulador de circuitos eléctricos</title>
<meta name="theme-color" content="#06101c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Circuitos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#06101c;--bg2:#0c2036;--card:#0f2338;--card2:#15304b;--line:#24405b;--tx:#f2f7ff;--mu:#9db3c9;--bl:#6fd8f2;--or:#ff9a3d;--gold:#ffd43b;--gr:#5ce0a0;--rd:#ff6b6b;--ink:#06101c;--shadow:#0007}
:root[data-theme=light]{color-scheme:light;--bg:#eef3f9;--bg2:#ffffff;--card:#ffffff;--card2:#e4edf6;--line:#b9c9da;--tx:#0f1b2a;--mu:#4b5d73;--bl:#0a6f9a;--or:#c8641a;--gold:#b88400;--gr:#0f7a45;--rd:#c62828;--ink:#ffffff;--shadow:#1b2f4a30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(circle at 50% -10%,var(--bg2),var(--bg) 62%);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column}
#main{flex:1 1 auto;min-height:0;position:relative}
.scr{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 0 24px;display:none}
.scr.on{display:block}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(var(--bg),var(--bg)e0);backdrop-filter:blur(8px)}
.top h1{flex:1;margin:0;font-size:1.25rem}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:.9rem;white-space:nowrap}
.chip.fire{color:var(--or)}.chip.star{color:var(--gold)}
.ib{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:1.15rem}
.pad{padding:0 14px}
/* ---------- barra de pestañas ---------- */
#tabs{flex:0 0 auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px var(--shadow)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border-radius:12px;color:var(--mu);font-size:.7rem;font-weight:700}
#tabs button span{font-size:1.4rem;line-height:1.1}
#tabs button.on{color:var(--tx);background:var(--card2)}
/* ---------- camino de niveles ---------- */
.hero{margin:6px 14px 14px;padding:16px;border-radius:22px;background:linear-gradient(135deg,#1d5b86,#12304b 70%);color:#fff;box-shadow:0 10px 26px var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#ffd43b55,#0000 70%)}
.hero small{display:block;opacity:.85;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:.7rem}
.hero h2{margin:3px 0 4px;font-size:1.35rem}.hero p{margin:0 0 12px;opacity:.9;font-size:.9rem}
.cta{display:block;width:100%;padding:14px;border-radius:16px;background:#ffd43b;color:#241a00;font-weight:900;font-size:1.1rem;box-shadow:0 6px 0 #b88a00;transition:transform .08s,box-shadow .08s}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #b88a00}
.cta.sec{background:var(--card2);color:var(--tx);box-shadow:0 6px 0 var(--line)}
.bloque{margin:18px 14px 8px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:10px}
.bloque .bi{font-size:1.8rem}.bloque b{display:block}.bloque small{color:var(--mu);font-size:.78rem}.bloque .bm{margin-left:auto;font-size:1.7rem}
.road{position:relative;padding:6px 0 4px}
.road:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:repeating-linear-gradient(var(--line) 0 8px,#0000 8px 16px)}
.nrow{position:relative;display:flex;flex-direction:column;align-items:center;margin:14px 0}
.node{position:relative;width:76px;height:76px;border-radius:50%;background:var(--card2);border:4px solid var(--line);color:var(--tx);font-weight:900;font-size:1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 7px 0 var(--line);transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--line)}
.node .nk{font-size:.8rem;margin-top:3px;opacity:.9}
.node.lock{opacity:.55;filter:grayscale(.8)}
.node.s1{background:#7a4a2a;border-color:#c98a56;box-shadow:0 7px 0 #4a2a14}.node.s2{background:#5d6a7a;border-color:#c9d4e2;box-shadow:0 7px 0 #38434f}.node.s3{background:#a77c00;border-color:#ffd43b;box-shadow:0 7px 0 #6b4f00;color:#fff}
.node.now{background:var(--bl);border-color:#fff;color:var(--ink);box-shadow:0 7px 0 #1f7f9a;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.nst{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:.85rem;letter-spacing:1px;color:var(--gold);text-shadow:0 1px 2px #000a;white-space:nowrap}
.nlab{margin-top:24px;max-width:200px;text-align:center;font-size:.78rem;color:var(--mu);font-weight:700}
.node.sim{border-radius:22px;width:92px;height:84px;background:linear-gradient(145deg,#6a3fd0,#3a1f8a);border-color:#b9a0ff;box-shadow:0 7px 0 #2a1566;color:#fff;font-size:1.05rem}
.node.sim.lock{background:var(--card2);border-color:var(--line);box-shadow:0 7px 0 var(--line);color:var(--tx)}
.node.sim.s3,.node.sim.s2,.node.sim.s1{background:linear-gradient(145deg,#6a3fd0,#3a1f8a);border-color:#ffd43b}
.fin{margin:22px 14px;text-align:center;color:var(--mu);font-size:.85rem}
/* ---------- hojas y superposiciones ---------- */
.layer{position:fixed;inset:0;z-index:50;display:none}.layer.on{display:block}
.shbg{position:absolute;inset:0;background:#02080fcc;backdrop-filter:blur(3px)}
.shcard{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:var(--card);border-top:2px solid var(--bl);box-shadow:0 -14px 40px var(--shadow);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.shcard h3{margin:0 0 2px;font-size:1.3rem}.shcard .kind{display:inline-block;margin-bottom:8px;padding:2px 10px;border-radius:999px;background:var(--card2);color:var(--mu);font-weight:800;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
.shcard p{margin:6px 0;color:var(--tx)}.shcard .note{padding:9px 12px;border-radius:12px;background:var(--card2);color:var(--mu);font-size:.86rem;margin:10px 0}
.shcard .stars{font-size:1.6rem;letter-spacing:3px;color:var(--gold)}
.full{position:fixed;inset:0;z-index:60;display:none;overflow:auto;background:radial-gradient(circle at 50% -10%,var(--bg2),var(--bg) 62%);padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}.full.on{display:block}
.full h2{margin:0 0 4px;font-size:1.6rem}.full .sub{color:var(--mu);margin:0 0 14px}
.card{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin:0 0 12px}
.big{text-align:center}.bigstars{font-size:3rem;letter-spacing:6px;line-height:1.1}
.bigstars span{display:inline-block;color:var(--line);transform:scale(.3);opacity:0;animation:starin .55s cubic-bezier(.2,1.8,.4,1) forwards}.bigstars span.on{color:var(--gold);text-shadow:0 0 18px #ffb400,0 0 5px #fff}
@keyframes starin{to{transform:scale(1);opacity:1}}
.gap{display:grid;gap:10px;margin-top:14px}
.tag{display:inline-block;margin:3px 3px 0 0;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:.82rem;font-weight:700}
.tag.g{border-color:var(--gold);color:var(--gold)}.tag.f{border-color:var(--or);color:var(--or)}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mu);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase}
.okc{color:var(--gr);font-weight:800}.noc{color:var(--rd);font-weight:800}
/* ---------- jugar ---------- */
#play{position:fixed;inset:0;z-index:40;display:none;background:var(--bg)}#play.on{display:block}
#play iframe,#otro iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#timer{position:absolute;z-index:45;top:calc(env(safe-area-inset-top) + 7px);left:50%;transform:translateX(-50%);padding:5px 14px;border-radius:999px;background:#000a;border:2px solid var(--bl);color:#fff;font:900 1.15rem ui-monospace,Consolas,monospace;pointer-events:none}
#timer.warn{border-color:var(--rd);color:var(--rd);animation:blink .8s steps(2) infinite}@keyframes blink{50%{background:#ff6b6b44}}
/* barra de resultado del nivel: delgada, abajo; el circuito queda a la vista y sigue funcionando (el iframe se achica, nada lo tapa) */
#resbar{position:absolute;left:0;right:0;bottom:0;z-index:46;display:none;align-items:center;gap:8px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:3px solid var(--gr);box-shadow:0 -4px 14px var(--shadow)}
#resbar.on{display:flex}#resbar.mal{border-top-color:var(--or)}
#play.conbarra #frm{height:calc(100% - var(--rbh,58px))}
.rb-st{letter-spacing:1px;color:var(--gold)}
.rb-tx{flex:1 1 auto;min-width:0;text-align:left;padding:2px 4px;border-radius:10px;line-height:1.2;color:var(--tx)}
.rb-tx b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-tx small{display:block;color:var(--mu);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-b{flex:0 0 auto;min-width:44px;height:44px;padding:0 10px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:1.05rem;font-weight:800;color:var(--tx)}.rb-b[hidden]{display:none}
.rb-go{background:#ffd43b;border-color:#ffd43b;color:#241a00;font-size:.95rem;font-weight:900}
@media (max-width:480px){.rb-l{display:none}}
.rb-b:focus-visible,.rb-tx:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
#rotar{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;background:radial-gradient(circle at 50% 30%,#1b4468,#06101c 70%);color:#fff}#rotar.on{display:flex}
#rotar .ph{font-size:4.5rem;animation:rot 2.2s ease-in-out infinite}@keyframes rot{0%,35%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
#rotar h2{margin:0}#rotar p{margin:0;opacity:.85}
#otro{position:fixed;inset:0;z-index:40;display:none;background:var(--bg);flex-direction:column}#otro.on{display:flex}
#otro .ob{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px calc(6px);padding-top:calc(6px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line)}
#otro .ob b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#otro .ow{flex:1;position:relative}
/* ---------- progreso y explorar ---------- */
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--bl),#3a7bd5);color:#fff;font-size:1.6rem;font-weight:900}
.pr-top{display:flex;align-items:center;gap:12px}
.pr-top input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:1.05rem;font-weight:700;user-select:text;-webkit-user-select:text}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.stat div{padding:12px;border-radius:14px;background:var(--card2);text-align:center}.stat b{display:block;font-size:1.6rem}.stat small{color:var(--mu);font-size:.72rem;font-weight:700}
.logro{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:12px;background:var(--card2);margin:7px 0}.logro .i{font-size:1.7rem;width:36px;text-align:center}.logro b{display:block;font-size:.92rem}.logro small{color:var(--mu);font-size:.76rem}.logro.off{opacity:.42;filter:grayscale(1)}
h3.sec{margin:20px 14px 8px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.item{display:block;width:calc(100% - 28px);margin:0 14px 9px;padding:13px 14px;text-align:left;border:1px solid var(--line);border-left:6px solid var(--bl);border-radius:14px;background:var(--card);position:relative}
.item b{display:block;font-size:1rem;margin-bottom:2px}.item span{display:block;color:var(--mu);font-size:.82rem}
.tilebtn{display:flex;gap:14px;align-items:center;width:calc(100% - 28px);margin:0 14px 10px;padding:14px;text-align:left;border-radius:18px;color:#fff;box-shadow:0 6px 18px var(--shadow)}
.tilebtn .ic{flex:0 0 50px;height:50px;border-radius:14px;background:#ffffff26;display:grid;place-items:center;font-size:1.7rem}.tilebtn b{display:block;font-size:1.05rem}.tilebtn span{font-size:.8rem;opacity:.92}
.t1{background:linear-gradient(135deg,#2d7fb8,#1b4f7a)}.t2{background:linear-gradient(135deg,#d89034,#9a5d14)}.t3{background:linear-gradient(135deg,#8c5bd1,#5a3490)}.t4{background:linear-gradient(135deg,#3a9d6b,#1d6a45)}.t5{background:linear-gradient(135deg,#c24b6a,#82263f)}
.tip{margin:12px 14px;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;color:var(--mu);font-size:.85rem;background:var(--card)}.tip button{margin-top:8px;padding:9px 14px;border-radius:10px;background:var(--bl);color:var(--ink);font-weight:800}
.foot{margin:18px 14px 8px;text-align:center;color:var(--mu);font-size:.76rem}.foot a{color:var(--bl)}
.nom-in{display:block;width:calc(100% - 28px);margin:6px 14px 14px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);font-size:1.05rem;user-select:text;-webkit-user-select:text}
input[type=search]{display:block;width:calc(100% - 28px);margin:0 14px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);font-size:1rem;user-select:text;-webkit-user-select:text}
#upd{position:fixed;left:10px;right:10px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:35;display:none;align-items:center;gap:8px;padding:10px 10px 10px 14px;border-radius:16px;background:linear-gradient(135deg,#1d5b86,#12304b);color:#fff;border:1px solid var(--bl);box-shadow:0 10px 30px #000a;font-size:.9rem}#upd.on{display:flex}#upd span{flex:1}.updb{padding:9px 14px;border-radius:12px;background:#ffd43b;color:#241a00;font-weight:900}.updb:disabled{opacity:.6}.updx{width:34px;height:34px;border-radius:10px;background:#ffffff22;color:#fff}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;max-width:90%;padding:10px 16px;border-radius:999px;background:var(--card2);border:1px solid var(--bl);font-weight:700;font-size:.9rem;box-shadow:0 8px 24px #000a;display:none}
@media (orientation:landscape) and (max-height:520px){#tabs{padding:2px}#tabs button span{font-size:1.1rem}.node{width:64px;height:64px}.hero{margin:6px 14px}.shcard{left:50%;right:auto;width:min(560px,96%);transform:translateX(-50%);animation:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
 <main id="main">
  <section id="s-camino" class="scr on"></section>
  <section id="s-sim" class="scr"></section>
  <section id="s-prog" class="scr"></section>
  <section id="s-mas" class="scr"></section>
 </main>
 <nav id="tabs" aria-label="Secciones">
  <button data-t="camino" class="on"><span>🛤️</span>Camino</button>
  <button data-t="sim"><span>⏱️</span>Simulacro</button>
  <button data-t="prog"><span>🏅</span>Mi progreso</button>
  <button data-t="mas"><span>🔎</span>Más</button>
 </nav>
</div>
<section id="play"><iframe id="frm" title="Problema" allow="fullscreen"></iframe><div id="timer" hidden>3:00</div>
 <div id="resbar" role="status" aria-live="polite"><button class="rb-tx" id="rbTx"></button><button class="rb-b" id="rbAgain" aria-label="Jugar de nuevo" title="Jugar de nuevo" hidden>↻</button><button class="rb-b" id="rbBack" aria-label="Volver al camino" title="Volver al camino">🛤️</button><button class="rb-b rb-go" id="rbNext"><span class="rb-l">Siguiente </span>▶</button></div></section>
<section id="otro"><div class="ob"><button class="ib" id="otroBack" aria-label="Volver">←</button><b id="otroTit"></b></div><div class="ow"><iframe id="frm2" title="Práctica"></iframe></div></section>
<div id="sheet" class="layer"><div class="shbg"></div><div class="shcard" id="shcard"></div></div>
<div id="fs" class="full"></div>
<div id="rotar"><div class="ph">📱</div><h2>Girá el celular</h2><p>Para armar circuitos necesitás la pantalla acostada: así los cables y los bornes se ven bien grandes.</p><button class="cta sec" id="rotarBack" style="max-width:260px">Volver al camino</button></div>
<div id="upd" role="status"><span>✨ Hay una <b>versión nueva</b> de la app</span><button id="updOk" class="updb">Actualizar</button><button id="updNo" class="updx" aria-label="Más tarde">✕</button></div>
<div id="toast" role="status"></div>
<script src="archivos/comun.js"></script><script src="archivos/redes-datos.js"></script>
<script src="archivos/casas-datos.js"></script>
<script src="archivos/datos-datos.js"></script>
<script src="archivos/mando-datos.js"></script>
<script src="archivos/examen-gen.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* ---------- guardado en el teléfono ---------- */
const KEY='sim-niveles-v1';
const lsGet=k=>{try{return localStorage.getItem(k)}catch{return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
/* lectura segura: si lo guardado está dañado o tiene otro formato se arranca de cero en vez de romper la app */
let S=SIM.leerJSON(KEY,SIM.esObj,{});
S.niv=SIM.esObj(S.niv)?S.niv:{};S.sim=SIM.esObj(S.sim)?S.sim:{};S.racha=SIM.esObj(S.racha)?S.racha:{ult:'',dias:0,mejor:0};S.logros=SIM.esObj(S.logros)?S.logros:{};S.jugados=Number.isFinite(S.jugados)?S.jugados:0;
delete S.nombre;   /* el nombre ya no se guarda en el teléfono: se escribe recién al compartir (y se descarta) */
const save=()=>SIM.guardar(KEY,JSON.stringify(S));
const pad=n=>String(n).padStart(2,'0'),dayStr=o=>{const d=new Date();d.setDate(d.getDate()+(o||0));return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fechaHora=ts=>{const d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
/* ---------- niveles y bloques ---------- */
const BLOQUES=[
 {t:'Primeros circuitos',d:'Armá circuitos simples, en serie y en paralelo.',from:1,to:4,ico:'🔌'},
 {t:'Más circuitos y preguntas',d:'Ramas con llave, lámparas quemadas, mixtos y corriente.',from:5,to:8,ico:'🧩'},
 {t:'LED, fallas y resistores',d:'Elegí el resistor del LED, buscá fallas y calculá resistencias.',from:9,to:12,ico:'🔍'}];
const KIND={1:'wire',2:'wire',3:'wire',4:'quiz',5:'wire',6:'quiz',7:'wire',8:'quiz',9:'led',10:'fault',11:'quiz',12:'wire'};
const KICO={wire:'🔌',quiz:'❓',led:'🔴',fault:'🔍'},KTXT={wire:'Armá el circuito',quiz:'Pregunta',led:'Armá el circuito',fault:'Buscá la falla'};

 $('#shcard').innerHTML=h;capa('sheet',true);const x=$('#shX');if(x)x.onclick=()=>capa('sheet',false);const g=$('#shGo');if(g)g.onclick=()=>{capa('sheet',false);iniciarSim(k)}}
function iniciarSim(k){const b=BLOQUES[k-1],lv=shuf([...Array(b.to-b.from+1).keys()].map(i=>b.from+i)).slice(0,3);S.jugados++;cur={mode:'sim',k,levels:lv,specs:lv.map(l=>GEN.make(l)),i:0,res:[],enCurso:false};intermedioSim()}
function intermedioSim(){const sp=cur.specs[cur.i],l=cur.levels[cur.i],land=needLand(sp.kind);cur.enCurso=false;
 abrirFull(`<div class="big" style="margin-top:12vh"><div class="meta" style="color:var(--mu);font-weight:800">Simulacro ${cur.k} · Problema ${cur.i+1} de 3</div><h2 style="margin:6px 0">Nivel ${l}</h2><p style="font-size:1.2rem;font-weight:800">${esc(tipoDe(l))}</p><p style="color:var(--mu)">⏱️ ${LIM/60} minutos · sin pistas</p><p class="card" style="margin-top:12px">${land?'📱 Este problema se resuelve con el celular <b>acostado</b>.':'📱 Este problema se resuelve en <b>vertical</b>.'}</p></div><div class="gap"><button class="cta" id="iGo">¡Comenzar! ▶</button><button class="cta sec" id="iX">Salir del simulacro</button></div>`);
 $('#iGo').onclick=()=>{capa('fs',false);cur.enCurso=true;cargarProblema(sp,{examen:true})};$('#iX').onclick=()=>{capa('fs',false);cur=null;irTab('sim')}}
function iniciarTimer(){clearInterval(timerId);const T=$('#timer');T.hidden=false;const fin=Date.now()+LIM*1000;cur.fin=fin;
 const tick=()=>{const r=Math.max(0,Math.ceil((fin-Date.now())/1000));T.textContent=Math.floor(r/60)+':'+pad(r%60);T.classList.toggle('warn',r<=30);if(r<=0){clearInterval(timerId);try{SIM.post($('#frm').contentWindow,{tipo:'examen-forzar'})}catch{}setTimeout(()=>{if(cur&&cur.mode==='sim'&&cur.res.length===cur.i)entregaSim({ok:false,agotado:true,t:LIM})},2200)}};tick();timerId=setInterval(tick,250)}
function entregaSim(d){if(!cur||cur.mode!=='sim'||cur.res.length!==cur.i)return;clearInterval(timerId);$('#timer').hidden=true;
 cur.res.push({level:cur.levels[cur.i],tipo:tipoDe(cur.levels[cur.i]),ok:!!d.ok,t:d.t||0,inc:(d.shorts||0)+(d.burns||0),agotado:!!d.agotado});cur.i++;mostrarPlay(false);
 if(cur.i<3)intermedioSim();else finSim()}
const notaP=r=>r.ok?Math.max(6,10-r.inc):0;
function finSim(){const r=cur.res,nota=Math.round(r.reduce((s,x)=>s+notaP(x),0)/3*10)/10,k=cur.k,prev=S.sim[k];
 if(!prev||nota>=prev.nota)S.sim[k]={nota,at:Date.now(),n:(prev?prev.n:0)+1};else prev.n=(prev.n||0)+1;
 const racha=tickRacha(),logros=chequearLogros();save();const med=nota>=9?'🥇':nota>=7.5?'🥈':nota>=6?'🥉':'';
 let h=`<div class="big"><div class="meta" style="color:var(--mu);font-weight:800">Simulacro ${k} terminado</div><div style="font-size:4.2rem;font-weight:900;color:var(--gold);line-height:1.1;margin-top:6px">${String(nota).replace('.',',')}<small style="font-size:1.2rem;color:var(--mu)"> / 10</small></div><h2 style="margin:2px 0">${nota>=6?(med+' ¡Aprobaste!'):'Todavía no alcanza: ¡a practicar!'}</h2></div>
 <div class="card"><table><tr><th>#</th><th>Problema</th><th>Resultado</th><th>Nota</th></tr>${r.map((x,i)=>`<tr><td>${i+1}</td><td>Nivel ${x.level}<br><small style="color:var(--mu)">${esc(x.tipo)}</small></td><td class="${x.ok?'okc':'noc'}">${x.ok?'✔ Bien':x.agotado?'⏰ Tiempo':'✖ Mal'}</td><td><b>${notaP(x)}</b></td></tr>`).join('')}</table></div><div class="card">`;
 if(racha)h+=`<span class="tag f">🔥 ¡Racha de ${S.racha.dias} día${S.racha.dias>1?'s':''}!</span>`;

 h+=`<span class="tag">${fechaHora(Date.now())}</span></div><div class="gap"><button class="cta" id="sAgain">Rendir otro simulacro ▶</button><button class="cta sec" id="sBack">Volver</button></div>`;
 cur=null;abrirFull(h);$('#sAgain').onclick=()=>{capa('fs',false);iniciarSim(k)};$('#sBack').onclick=()=>{capa('fs',false);irTab('sim')}}

function pintarProg(){const el=$('#s-prog');const act=nivActual(),max=Math.max(0,act-1);
 const sims=Object.keys(S.sim).sort().map(k=>`<tr><td>Simulacro ${k}</td><td><b>${String(S.sim[k].nota).replace('.',',')}</b> / 10</td><td>${fechaHora(S.sim[k].at)}</td></tr>`).join('');

 ${sims?`<table style="margin-top:12px"><tr><th>Simulacro</th><th>Nota</th><th>Fecha</th></tr>${sims}</table>`:'<p style="color:var(--mu);font-size:.88rem;margin:12px 0 0">Todavía no rendiste ningún simulacro.</p>'}
 ${(()=>{const v=Object.values(S.niv).reduce((a,x)=>a+(x.v||0),0);return v?`<p style="color:var(--or);font-size:.85rem;margin:12px 0 0">👀 Veces que viste la solución: <b>${v}</b>. Un nivel visto con la solución no se acredita y queda anotado en el informe para tu docente.</p>`:''})()}
 <p style="color:var(--mu);font-size:.8rem;margin:12px 0 0">Resumen al ${fechaHora(Date.now())}</p></div>
 <button class="cta" id="pShare">📤 Informe para mi docente (compartir o copiar)</button></div>
 <h3 class="sec">Logros (${Object.keys(S.logros).length}/${LOGROS.length})</h3><div class="pad">${LOGROS.map(l=>`<div class="logro ${S.logros[l.id]?'':'off'}"><div class="i">${l.ico}</div><div><b>${esc(l.n)}</b><small>${esc(l.d)}</small></div></div>`).join('')}</div>
 <div class="pad" style="margin-top:16px"><button class="cta sec" id="pReset">Borrar mi progreso</button></div>`;
 el.innerHTML=h;bindTop(el);
 $('#pShare').onclick=()=>pedirNombre(nombre=>{const t=resumenTexto(nombre);if(navigator.share){navigator.share({title:'Mi progreso en Circuitos',text:t}).catch(()=>{})}else{try{navigator.clipboard.writeText(t).then(()=>toast('Resumen copiado: pegalo en un mensaje.'),()=>toast('No se pudo copiar.'))}catch{toast('No se pudo copiar.')}}});

function pedirNombre(cb){abrirFull(`<div class="big" style="margin-top:14vh"><h2>¿Con qué nombre lo mandás?</h2><p style="color:var(--mu)">Es opcional. No se guarda en la app: solo va dentro del mensaje que compartís.</p></div><input id="nom2" class="nom-in" type="text" maxlength="40" placeholder="Escribí tu nombre (opcional)" autocomplete="off" aria-label="Tu nombre (opcional)"><div class="gap"><button class="cta" id="nOk">Compartir</button><button class="cta sec" id="nNo">Cancelar</button></div>`);
 const i=$('#nom2');setTimeout(()=>{try{i.focus()}catch{}},60);$('#nOk').onclick=()=>{const v=i.value.trim();capa('fs',false);cb(v)};$('#nNo').onclick=()=>capa('fs',false);i.onkeydown=e=>{if(e.key==='Enter')$('#nOk').click()}}
/* informe para el docente: dice qué niveles superó por su cuenta y cuáles con pista, errores o tras ver la solución */
const veces=n=>n+(n>1?' veces':' vez');
function lineaNivel(n){const e=S.niv[n]||{},p=e.pri,et=(n>12?'Desafío ':'Nivel ')+n+' · '+tipoDe(n);
 if(e.s>=1){if(!p)return{k:'ant',t:'✔ '+et+' '+starsTxt(e.s)+' · (registro de una versión anterior, sin detalle)'};
  const nt=[];if(p.j>1)nt.push('a la partida '+p.j);
  if(p.v>0){nt.unshift('VIO LA SOLUCIÓN '+veces(p.v)+' antes de superarlo');if(p.h)nt.push('usó pista');if(p.e)nt.push(p.e+(p.e>1?' errores':' error'));return{k:'sol',t:'⚠ '+et+' '+starsTxt(e.s)+' · '+nt.join(' · ')}}
  if(p.h)nt.push('usó pista');if(p.e)nt.push(p.e+(p.e>1?' errores':' error'));
  return{k:p.h||p.e?'ayuda':'solo',t:'✔ '+et+' '+starsTxt(e.s)+(nt.length?' · '+nt.join(' · '):' · sin ayuda')}}
 const nt=[];if(e.j)nt.push(e.j+(e.j>1?' partidas':' partida'));if(e.v)nt.push('vio la solución '+veces(e.v));if(e.f)nt.push(e.f+(e.f>1?' intentos terminados':' intento terminado')+' por errores');
 return{k:'no',t:'✘ '+et+' · TODAVÍA NO SUPERADO'+(nt.length?' · '+nt.join(' · '):'')}}
function resumenTexto(nombre){const act=nivActual();
 const ns=Object.keys(S.niv).map(Number).filter(n=>n>0).sort((a,b)=>a-b),ls=ns.map(lineaNivel),c=k=>ls.filter(x=>x.k===k).length,vistas=ns.reduce((a,n)=>a+(S.niv[n].v||0),0);
 const l=[`INFORME DE PROGRESO · Simulador de circuitos eléctricos (v${SIM.VERSION})`,`${nombre||'Alumno/a'} · ${fechaHora(Date.now())}`,
  `Camino de niveles: ${Math.max(0,act-1)} superados · Estrellas: ${totalEst()} · Racha: ${rachaAct()} día(s) (mejor ${S.racha.mejor||0})`,
  `Superados por su cuenta y sin ayuda: ${c('solo')+c('ant')} · con pista o errores: ${c('ayuda')} · tras ver la solución: ${c('sol')} · sin superar: ${c('no')}`,
  `Veces que apretó «Ver solución»: ${vistas}`,'','DETALLE POR NIVEL'];
 ls.forEach(x=>l.push(x.t));
 const sk=Object.keys(S.sim).sort();if(sk.length){l.push('','SIMULACROS (sin pistas ni solución)');sk.forEach(k=>l.push(`Simulacro ${k}: ${String(S.sim[k].nota).replace('.',',')}/10 (${fechaHora(S.sim[k].at)})`))}
 l.push('','Cómo leerlo: ✔ lo resolvió por su cuenta · ⚠ apretó «Ver solución» (un nivel visto con la solución nunca se acredita: debe superar otra variante) · ✘ todavía no superado.');
 return l.join('\n')}
